<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>国方 · 账户</title><link rel="stylesheet" href="./guofang-theme.css"><link rel="stylesheet" href="./account.css"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://guofangnt-proxy-fzqbqvazhn.cn-beijing.fcapp.run; base-uri 'none'; form-action 'self'"><script src="./cloud-config.js"></script><script src="./cloud-transport.js"></script></head>
<body class="account-page"><header class="account-header"><a href="./"><img src="./assets/guofang-logo.png" alt="国方创投 Growth"></a><span>智能问数 &amp; 信披</span><nav id="accountNav" hidden><a href="./">返回工作台</a><a href="./account.html">我的账户</a><button id="logout" type="button">退出登录</button></nav></header>
<main class="account-main"><p id="notice" class="account-notice" role="status"></p>
<section id="accessPanel" class="account-card narrow" hidden><h1 id="accessTitle">登录</h1><p id="accessDescription">使用管理员分配的账号。</p><form id="accessForm"><label id="usernameField">账号<input id="username" required autocomplete="username" minlength="3" maxlength="64" placeholder="例如 allen.ruan"></label><label id="nameField" hidden>姓名<input id="displayName" maxlength="80" autocomplete="name"></label><label>密码<input id="password" type="password" required maxlength="128" autocomplete="current-password"></label><label id="repeatField" hidden>确认密码<input id="repeatPassword" type="password" maxlength="128" autocomplete="new-password"></label><button id="accessSubmit" class="primary" type="submit">登录</button></form><p id="passwordHint" class="muted"></p><p class="muted">仅内部同事使用。忘记密码请联系管理员创建重置链接。</p></section>
<section id="profilePanel" class="account-card narrow" hidden><h1>我的账户</h1><p id="profileName"></p><p id="profilePermissions"></p><p id="profileUsage" class="muted"></p><h2>修改密码</h2><form id="passwordForm"><label>当前密码<input id="oldPassword" type="password" required autocomplete="current-password" maxlength="128"></label><label>新密码<input id="newPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>确认新密码<input id="confirmNewPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button class="primary" type="submit">保存并重新登录</button></form></section>
<section id="adminPanel" hidden><div class="admin-heading"><div><h1>用户管理</h1><p class="muted">管理账号、权限和用量。任务、文件、对话与个人规则由本人管理。</p></div><button id="refreshUsers" type="button">刷新列表</button></div><div class="account-card"><h2>创建账号</h2><form id="createForm" class="create-form"><label>账号<input id="newUsername" required minlength="3" maxlength="64" autocomplete="off"></label><label>姓名<input id="newDisplayName" required maxlength="80" autocomplete="off"></label><div><fieldset id="newRoles"><legend>角色</legend></fieldset><fieldset id="newPermissions"><legend>功能权限</legend></fieldset></div><button class="primary" type="submit">创建并生成激活链接</button></form></div><div id="invitationPanel" class="account-card" hidden><h2>一次性激活 / 重置链接</h2><p id="invitationDescription"></p><label>链接<textarea id="invitationLink" rows="3" readonly></textarea></label><button id="copyInvitation" type="button">复制链接</button><p class="muted">链接 48 小时有效，使用一次后失效。由管理员交给对应同事，同事自行设置密码。</p></div><div class="account-card"><h2>内部账号</h2><div class="table-wrap"><table><thead><tr><th>姓名 / 账号</th><th>状态</th><th>角色与权限</th><th>用量</th><th>管理</th></tr></thead><tbody id="usersBody"></tbody></table></div></div><div class="account-card"><h2>管理操作记录</h2><ul id="auditList"></ul></div></section>
</main><dialog id="editDialog" class="account-card"><form id="editForm"><h2>调整账号</h2><p id="editUsername"></p><label>姓名<input id="editDisplayName" required maxlength="80"></label><fieldset id="editRoles"><legend>角色</legend></fieldset><fieldset id="editPermissions"><legend>功能权限</legend></fieldset><div class="edit-actions"><button id="cancelEdit" type="button">取消</button><button class="primary" type="submit">保存并撤销该账号会话</button></div></form></dialog><script src="./account.js"></script></body></html>
